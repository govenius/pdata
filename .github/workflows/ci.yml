# .github/workflows/ci.yml

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Run all tests under test/
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel
        run: |
          pip install --force-reinstall dist/*.whl

      - name: Check that tabular_data_parser was compiled and installed
        run: |
          python -c "from pdata.analysis.fast_parser import tabular_data_parser"

      - name: Run Python tests
        working-directory: test
        run: python run_test.py
